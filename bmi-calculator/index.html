<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator — figgn</title>
<style>
:root{--bg:#f8f9fb;--card:#fff;--text:#111;--text2:#555;--accent:#e65c00;--accent2:#c24d00;--accent3:#ff8a3d;--res-bg:#e7f5ec;--res-text:#0d5c2e;--border:#ccc;--line:#e4e4ea;--ad-bg:#f0f0f0;--ad-text:#888}
[data-theme=dark]{--bg:#131318;--card:#1c1c24;--text:#e0e0e0;--text2:#999;--accent2:#c24d00;--accent3:#ff8a3d;--res-bg:#0a3020;--res-text:#4ade80;--border:#3a3a48;--line:#2a2a34;--ad-bg:#22222b;--ad-text:#777}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
a{color:var(--accent3)}a:hover{color:var(--accent2)}
header{background:var(--accent);color:#fff}
.hbar{max-width:760px;margin:0 auto;padding:0 12px;height:48px;display:flex;align-items:center;justify-content:space-between}
.wordmark{color:#fff;text-decoration:none;font-size:19px;font-weight:700}
.hnav{display:flex;align-items:center;gap:12px;font-size:14px}
.hnav a{color:#fff;text-decoration:none;font-weight:600}
#themeBtn{background:var(--accent2);color:#fff;border:1px solid rgba(255,255,255,.65);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
footer{background:#1c1c24;padding:14px 0;margin-top:40px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;color:#aaa;font-size:13px}
footer a{color:#aaa}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--text2);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.crumb{font-size:13px;color:var(--text2);margin:12px 0 6px}
.crumb a{color:var(--text2)}
label{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:4px;font-weight:600}
input[type=number]{width:100%;min-height:56px;font-size:18px;font-family:"SF Mono","Cascadia Code",Consolas,monospace;border:1px solid var(--border);border-radius:4px;padding:0 12px;background:var(--card);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.btnrow button{padding:8px 14px;font-size:13px;font-family:inherit;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);cursor:pointer;min-height:40px}
.btnrow button.on{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:700}
.stepper{display:flex;align-items:center;gap:0;margin-bottom:14px}
.stepper button{min-height:56px;min-width:44px;font-size:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
.stepper button:first-child{border-radius:4px 0 0 4px}
.stepper button:last-child{border-radius:0 4px 4px 0}
.stepper input{border-radius:0;text-align:center;min-width:60px;width:60px;border-left:0;border-right:0}
.result{margin-top:14px;padding:14px;background:var(--res-bg);border-radius:4px;text-align:center}
.result .big{font-size:36px;font-weight:700;color:var(--res-text);font-family:"SF Mono","Cascadia Code",Consolas,monospace}
.result .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--res-text);margin-bottom:2px}
.result .sub{font-size:13px;color:var(--res-text);margin-top:2px;opacity:.8}
.detail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.detail .stat{background:var(--ad-bg);padding:10px;border-radius:4px;text-align:center}
.detail .stat .v{font-size:17px;font-weight:700;font-family:"SF Mono","Cascadia Code",Consolas,monospace}
.detail .stat .k{font-size:11px;text-transform:uppercase;color:var(--text2)}
.note{font-size:13px;color:var(--text2);margin-top:10px;font-style:italic}
.hidden{display:none}
@media(max-width:480px){.row{grid-template-columns:1fr}}
/* Scale bar */
.scale-wrap{margin-top:14px}
.scale-bar{height:18px;border-radius:9px;background:linear-gradient(to right,#4ade80,#a3e635,#facc15,#f97316,#ef4444);position:relative}
.scale-marker{position:absolute;top:-4px;width:3px;height:26px;background:var(--text);border-radius:2px;transform:translateX(-50%);transition:left .3s}
.scale-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <a href="/" class="wordmark">figgn</a>
    <div class="hnav">
      <a href="/blog/">Blog</a>
      <button id="themeBtn">Dark</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="crumb"><a href="/">Home</a> &rsaquo; BMI Calculator</div>
  <h1>BMI Calculator</h1>
  <p class="sub">Calculate your Body Mass Index (BMI) and find your healthy weight range.</p>

  <div class="card">
    <!-- Unit toggle -->
    <label>Units</label>
    <div class="btnrow" id="unitToggle">
      <button class="on" data-unit="imperial">Imperial (lb, ft/in)</button>
      <button data-unit="metric">Metric (kg, cm)</button>
    </div>

    <!-- Imperial inputs -->
    <div id="imperialInputs">
      <label>Weight</label>
      <div class="stepper">
        <button onclick="step('impWeight',-1)">&minus;</button>
        <input type="number" id="impWeight" value="180" min="20" max="800" oninput="calc()">
        <button onclick="step('impWeight',1)">+</button>
      </div>
      <div class="row">
        <div>
          <label>Height (ft)</label>
          <div class="stepper">
            <button onclick="step('impFt',-1)">&minus;</button>
            <input type="number" id="impFt" value="5" min="3" max="7" oninput="calc()">
            <button onclick="step('impFt',1)">+</button>
          </div>
        </div>
        <div>
          <label>Height (in)</label>
          <div class="stepper">
            <button onclick="step('impIn',-1)">&minus;</button>
            <input type="number" id="impIn" value="10" min="0" max="11" oninput="calc()">
            <button onclick="step('impIn',1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Metric inputs (hidden by default) -->
    <div id="metricInputs" class="hidden">
      <label>Weight (kg)</label>
      <div class="stepper">
        <button onclick="step('metWeight',-1)">&minus;</button>
        <input type="number" id="metWeight" value="82" min="10" max="400" oninput="calc()">
        <button onclick="step('metWeight',1)">+</button>
      </div>
      <label>Height (cm)</label>
      <div class="stepper">
        <button onclick="step('metHeight',-1)">&minus;</button>
        <input type="number" id="metHeight" value="178" min="50" max="280" oninput="calc()">
        <button onclick="step('metHeight',1)">+</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="card">
    <div class="result" id="resultBox">
      <div class="label">Your BMI</div>
      <div class="big" id="bmiVal">—</div>
      <div class="sub" id="bmiCat"></div>
    </div>

    <div class="scale-wrap">
      <div class="scale-bar">
        <div class="scale-marker" id="scaleMarker" style="left:50%"></div>
      </div>
      <div class="scale-labels">
        <span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span>
      </div>
    </div>

    <div class="detail">
      <div class="stat"><div class="v" id="detailWeight">180 lb</div><div class="k">Weight</div></div>
      <div class="stat"><div class="v" id="detailHeight">5'10"</div><div class="k">Height</div></div>
      <div class="stat"><div class="v" id="detailTarget">—</div><div class="k">To Reach Normal</div></div>
    </div>
    <p class="note" id="rangeNote">Healthy BMI range: 18.5 &ndash; 24.9</p>
  </div>
</div>

<footer>
  <div class="wrap">
    &copy; 2026 figgn
    <a href="/privacy/">Privacy</a>
    <a href="/blog/">Blog</a>
    <a href="/">All calculators</a>
  </div>
</footer>

<script>
var theme=localStorage.getItem('theme');if(!theme||(theme!=='dark'&&theme!=='light'))theme=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',theme);var tb=document.getElementById('themeBtn');if(tb){tb.textContent=theme==='dark'?'Light':'Dark';tb.onclick=function(){theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('theme',theme);tb.textContent=theme==='dark'?'Light':'Dark';}};

var currentUnit = 'imperial';

// Unit toggle
document.getElementById('unitToggle').addEventListener('click', function(e) {
  if (e.target.tagName !== 'BUTTON') return;
  currentUnit = e.target.dataset.unit;
  var btns = this.querySelectorAll('button');
  btns.forEach(function(b) { b.classList.toggle('on', b.dataset.unit === currentUnit); });
  document.getElementById('imperialInputs').classList.toggle('hidden', currentUnit !== 'imperial');
  document.getElementById('metricInputs').classList.toggle('hidden', currentUnit !== 'metric');
  calc();
});

function step(id, delta) {
  var el = document.getElementById(id);
  var v = parseInt(el.value) || 0;
  el.value = v + delta;
  calc();
}

function calc() {
  var bmi, weightLb, weightKg, heightCm, heightIn;
  var catText = '', catColor = '';

  if (currentUnit === 'imperial') {
    var lbs = parseFloat(document.getElementById('impWeight').value) || 180;
    var ft = parseInt(document.getElementById('impFt').value) || 5;
    var inch = parseInt(document.getElementById('impIn').value) || 10;
    heightIn = ft * 12 + inch;
    weightLb = lbs;
    bmi = (lbs * 703) / (heightIn * heightIn);
    weightKg = lbs * 0.453592;
    heightCm = heightIn * 2.54;
    document.getElementById('detailWeight').textContent = lbs + ' lb (' + weightKg.toFixed(1) + ' kg)';
    document.getElementById('detailHeight').textContent = ft + '\'' + inch + '" (' + heightCm.toFixed(1) + ' cm)';
  } else {
    var kg = parseFloat(document.getElementById('metWeight').value) || 82;
    var cm = parseFloat(document.getElementById('metHeight').value) || 178;
    heightCm = cm;
    heightIn = cm / 2.54;
    weightKg = kg;
    weightLb = kg * 2.20462;
    bmi = kg / ((cm / 100) * (cm / 100));
    var ftTotal = heightIn / 12;
    var ftDisplay = Math.floor(ftTotal);
    var inDisplay = Math.round(heightIn - ftDisplay * 12);
    if (inDisplay === 12) { ftDisplay++; inDisplay = 0; }
    document.getElementById('detailWeight').textContent = kg + ' kg (' + weightLb.toFixed(1) + ' lb)';
    document.getElementById('detailHeight').textContent = ftDisplay + '\'' + inDisplay + '" (' + cm + ' cm)';
  }

  if (isNaN(bmi) || !isFinite(bmi)) {
    document.getElementById('bmiVal').textContent = '—';
    document.getElementById('bmiCat').textContent = '';
    document.getElementById('detailTarget').textContent = '—';
    document.getElementById('scaleMarker').style.left = '50%';
    return;
  }

  bmi = Math.round(bmi * 10) / 10;
  document.getElementById('bmiVal').textContent = bmi.toFixed(1);

  if (bmi < 18.5) {
    catText = 'Underweight';
  } else if (bmi < 25) {
    catText = 'Normal weight';
  } else if (bmi < 30) {
    catText = 'Overweight';
  } else {
    catText = 'Obese';
  }
  document.getElementById('bmiCat').textContent = catText;

  // Healthy weight range for this height
  var minHealthyLb = (18.5 * heightIn * heightIn) / 703;
  var maxHealthyLb = (24.9 * heightIn * heightIn) / 703;
  document.getElementById('rangeNote').textContent = 'Healthy BMI range: 18.5 \u2013 24.9' +
    ' \u2192 Healthy weight: ' + Math.round(minHealthyLb) + ' \u2013 ' + Math.round(maxHealthyLb) + ' lb';

  // To reach normal
  if (bmi < 18.5) {
    var gainLb = minHealthyLb - weightLb;
    document.getElementById('detailTarget').textContent = 'Gain ' + Math.round(gainLb) + ' lb';
  } else if (bmi >= 25) {
    var loseLb = weightLb - maxHealthyLb;
    document.getElementById('detailTarget').textContent = 'Lose ' + Math.round(loseLb) + ' lb';
  } else {
    document.getElementById('detailTarget').textContent = 'You\'re in range!';
  }

  // Scale marker (BMI maps 10-40 across the bar width)
  var markerPct = Math.max(0, Math.min(100, ((bmi - 10) / 30) * 100));
  document.getElementById('scaleMarker').style.left = markerPct + '%';
}

calc();
</script>
</body>
</html>
