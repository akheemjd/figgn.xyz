<style>
:root{--bg:#f8f9fb;--card:#fff;--text:#111;--text2:#555;--accent:#e65c00;--accent2:#c24d00;--accent3:#ff8a3d;--border:#ccc;--line:#e4e4ea}
[data-theme=dark]{--bg:#131318;--card:#1c1c24;--text:#e0e0e0;--text2:#999;--accent2:#c24d00;--accent3:#ff8a3d;--border:#3a3a48;--line:#2a2a34}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
a{color:var(--accent3);text-decoration:none}
a:hover{color:var(--accent2)}
header{background:var(--accent);color:#fff}
.hbar{max-width:760px;margin:0 auto;padding:0 12px;height:48px;display:flex;align-items:center;justify-content:space-between}
.wordmark{color:#fff;text-decoration:none;font-size:19px;font-weight:700}
.hnav{display:flex;align-items:center;gap:12px;font-size:14px}
.hnav a{color:#fff;text-decoration:none;font-weight:600}
#themeBtn{background:var(--accent2);color:#fff;border:1px solid rgba(255,255,255,.65);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
footer{background:#1c1c24;padding:14px 0;margin-top:40px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;color:#aaa;font-size:13px}
footer a{color:#aaa}
h1{font-size:24px;margin:20px 0 4px}
.sub{color:var(--text2);font-size:15px;margin:0 0 20px}
.post{display:block;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.post:hover{border-color:var(--accent)}
.post .t{font-size:17px;font-weight:700;color:var(--text)}
.post .d{font-size:13px;color:var(--text2);margin-top:3px}
.post .when{font-size:12px;color:var(--text2);margin-top:6px;font-family:monospace}
</style>
<script>
var theme=localStorage.getItem('theme');
if(!theme||(theme!=='dark'&&theme!=='light'))theme=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',theme);
</script>
</head>
<body>

<header><div class="hbar"><a href="/" class="wordmark">figgn</a><div class="hnav"><a href="/blog/">Blog</a><button id="themeBtn">Dark</button></div></div></header>

  <span class="when">3 August 2026</span>
</a>
</main>

<footer><div class="wrap">&copy; 2026 figgn <a href="/privacy/">Privacy</a> <a href="/blog/">Blog</a> <a href="/">All calculators</a></div></footer>

<script>
var tb=document.getElementById('themeBtn');
tb.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'Light':'Dark';
tb.onclick=function(){
  var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('theme',t);
  tb.textContent=t==='dark'?'Light':'Dark';
};
</script>

</body>
